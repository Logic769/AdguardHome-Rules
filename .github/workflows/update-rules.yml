name: 激进规则

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-commit-main:
    # push 时仅在 main 分支触发；schedule/手动触发则照常执行
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-main
      cancel-in-progress: true

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build lists and update README (main)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          OUTPUT_BLOCK_FILENAME: Black.txt
          OUTPUT_WHITE_FILENAME: White.txt
          OUTPUT_CONFLICT_FILENAME: Conflict.txt
          README_TITLE: 激进的规则
          RELEASE_TAG: stable-latest
        run: python documents/process_rules.py

      # ==========================================================================
      # 派生「非 AdGuard 解析器」可直接消费的清单。
      # 为什么需要：Black.txt 的「精确域名」段每行都以 "# From: 源名" 结尾。
      # ABP 规范里只有以 ! 开头的才是注释，行尾 # 不是；严格解析器（如 mosdns 的
      # adblock_set）会把整行当无效规则丢弃，等于 80 万条主体白白失效。
      # 本步骤不改 process_rules.py，只在 CI 侧做文本派生，AGH 侧行为完全不变。
      # ==========================================================================
      - name: 派生 mosdns/mihomo 可用清单
        run: |
          # ① 干净 ABP：剔除 ! 注释行与行尾注释，并排除「拦公共 DoH」的来源。
          #    HaGeZi Encrypted DNS 专门收录 doh.pub / dns.alidns.com 这类端点，
          #    自建解析链一旦加载就是自断上游。
          awk '/# From: HaGeZi Encrypted DNS/ {next} {sub(/[[:space:]]*#.*$/,"")} NF' \
            Black.txt | grep -v '^!' > Black-clean.txt || true

          # ② 纯域名版：||d^ 还原为裸域名，只保留合法域名，排序去重
          awk '{sub(/^[|][|]/,""); sub(/\^$/,""); print}' Black-clean.txt \
            | grep -E '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$' \
            | sort -u > Black-domains.txt || true

          # ③ 白名单纯域名（@@||d^ → d）
          grep -v '^!' White.txt \
            | awk '{sub(/[[:space:]]*#.*$/,""); if ($0=="") next; sub(/^@@[|][|]/,""); sub(/\^$/,""); print}' \
            | grep -E '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$' \
            | sort -u > White-domains.txt || true

          # ④ mosdns 的 adblock_set 只有 qname 匹配、没有 @@ 例外语义，
          #    所以白名单必须在生成阶段物理剔除，否则 587 条保护域名会被一并拦死
          grep -vxF -f White-domains.txt Black-domains.txt > Black-domains-safe.txt || true

          # ⑤ 自建解析链的上游域名强行放行，防「拦到自己」
          printf '%s\n' logic769.xyz doh.pub dns.alidns.com > upstream-allow.txt
          grep -vxF -f upstream-allow.txt Black-domains-safe.txt > Black-domains-final.txt || true

          # ⑥ 中文/本地源子集：给内存受限的路由器（512MB）用，量级小得多。
          #    域名空间拦截段（||d^）没有来源标注，整段保留；精确域名段按来源筛选。
          CN='anti-AD|那个谁520|10007|海哥|大萌主|秋风的规则|茯苓的广告规则|逆向涉猎|DD自用|困了想睡觉|本地规则'
          grep '^[|][|]' Black.txt > spaces.tmp || true
          grep -E "^[^!#]+ # From: (${CN})$" Black.txt \
            | sed -e 's/[[:space:]]*#.*$//' > cn.tmp || true
          cat spaces.tmp cn.tmp \
            | awk '{sub(/^[|][|]/,""); sub(/\^$/,""); print}' \
            | grep -E '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$' \
            | sort -u > Black-domains-cn.txt || true
          grep -vxF -f White-domains.txt Black-domains-cn.txt \
            | grep -vxF -f upstream-allow.txt > Black-domains-cn-final.txt || true

          echo "===== 派生清单统计 ====="
          echo "Black.txt 原始条数        : $(grep -v -c '^!' Black.txt || echo 0)"
          echo "Black-clean.txt（干净ABP）: $(wc -l < Black-clean.txt)"
          echo "Black-domains.txt（纯域名）: $(wc -l < Black-domains.txt)"
          echo "White-domains.txt（放行）  : $(wc -l < White-domains.txt)"
          echo "Black-domains-final.txt    : $(wc -l < Black-domains-final.txt)"
          echo "Black-domains-cn-final.txt : $(wc -l < Black-domains-cn-final.txt)"
          echo "===== 文件大小 ====="
          ls -lh Black-clean.txt Black-domains-final.txt Black-domains-cn-final.txt

      - name: Compute Beijing time for release title (main)
        id: time_main
        run: |
          echo "cn_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S (UTC+8)')" >> $GITHUB_OUTPUT

      - name: Prepare release body (main)
        run: |
          BLOCK_COUNT=$(grep -v -c '^!' Black.txt || echo 0)
          WHITE_COUNT=$(grep -v -c '^!' White.txt || echo 0)
          CONFLICT_COUNT=$(grep -v -c '^!' Conflict.txt || echo 0)
          DOMAIN_COUNT=$(wc -l < Black-domains-final.txt || echo 0)
          CN_COUNT=$(wc -l < Black-domains-cn-final.txt || echo 0)
          {
            echo "激进的规则（main 分支）本次构建统计"
            echo
            echo "- 黑名单规则: ${BLOCK_COUNT} 条"
            echo "- 白名单规则: ${WHITE_COUNT} 条"
            echo "- 冲突规则: ${CONFLICT_COUNT} 条"
            echo
            echo "## 派生物（给 mosdns / mihomo 等非 AdGuard 解析器）"
            echo
            echo "- Black-clean.txt: 去掉行尾注释的 ABP 语法"
            echo "- Black-domains-final.txt: 纯域名 ${DOMAIN_COUNT} 条（已剔除白名单与自建解析链上游，已排除拦 DoH 的来源）"
            echo "- Black-domains-cn-final.txt: 中文/本地源子集 ${CN_COUNT} 条（给内存受限设备）"
            echo "- White-domains.txt / upstream-allow.txt: 放行清单"
          } > release_body_main.md

      - name: Generate release tag
        id: generate_tag
        run: |
          echo "tag=stable-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload lists to GitHub Release (main)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.generate_tag.outputs.tag }}
          name: "激进的规则 ${{ steps.time_main.outputs.cn_time }}"
          bodyFile: release_body_main.md
          makeLatest: true
          allowUpdates: false
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "Black.txt,White.txt,Conflict.txt,Black-clean.txt,Black-domains.txt,Black-domains-final.txt,Black-domains-cn-final.txt,White-domains.txt,upstream-allow.txt"

      - name: Commit and push README only to main (safe rebase)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git fetch origin main
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git pull --rebase origin main || true

          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "docs(main): 更新 README"

          git fetch origin main
          git pull --rebase origin main || true

          git push origin "HEAD:main" || {
            echo "First push failed, attempting with --force-with-lease"
            git push --force-with-lease origin "HEAD:main"
          }
