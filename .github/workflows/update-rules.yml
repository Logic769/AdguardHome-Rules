name: 激进规则

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-commit-main:
    # push 时仅在 main 分支触发；schedule/手动触发则照常执行
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-main
      cancel-in-progress: true

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build lists and update README (main)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          OUTPUT_BLOCK_FILENAME: Black.txt
          OUTPUT_WHITE_FILENAME: White.txt
          OUTPUT_CONFLICT_FILENAME: Conflict.txt
          README_TITLE: 激进的规则
          RELEASE_TAG: stable-latest
        run: python documents/process_rules.py

      # ======================================================================
      # 派生 adblock 版（Black-adblock.txt）
      #
      # Black.txt 是「AdGuard Home 一键导入」格式，它混合了两种语法：
      #   · ||d^            走 ABP 解析，域名空间（含全部子域）
      #   · d # From: 源名  走 hosts 解析，精确匹配单主机，行尾 # 是 hosts 注释
      #
      # 通用 adblock 引擎（uBlock Origin / AdGuard / mihomo）不吃第二种写法：
      # ABP 规范里只有行首 ! 才是注释，行尾 # 不是，严格解析器会把整行丢弃。
      # 故本步骤把两种写法统一成纯 ABP：裸域名补成 ||d^，并去掉所有行尾注释。
      # process_rules.py 一行未改，AGH 侧的 Black.txt 行为完全不变。
      # ======================================================================
      - name: 派生 adblock 版（Black-adblock.txt）
        run: |
          {
            echo '! Title: 激进的规则（adblock 版）'
            echo '! Description: 与 Black.txt 同源，统一为 ABP 语法，可直接导入 uBlock Origin / AdGuard / mihomo'
            echo "! Homepage: https://github.com/${GITHUB_REPOSITORY}"
            echo "! Version: $(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"
            echo "! Last Updated: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') (UTC+8)"
            echo '!'
            echo '! ===== 拦截：域名空间（含全部子域）====='
            {
              grep '^[|][|]' Black.txt || true
              grep -v '^!' Black.txt \
                | grep -v '^[|][|]' \
                | sed -e 's/[[:space:]]*#.*$//' \
                | grep -v '^[[:space:]]*$' \
                | sed -e 's/^/||/' -e 's/$/^/'
            } | LC_ALL=C sort -u
            echo '!'
            echo '! ===== 放行：域名空间（例外优先于拦截）====='
            {
              grep '^@@[|][|]' White.txt || true
              grep -v '^!' White.txt \
                | grep -v '^@@[|][|]' \
                | sed -e 's/[[:space:]]*#.*$//' \
                | grep -v '^[[:space:]]*$' \
                | sed -e 's/^/@@||/' -e 's/$/^/'
            } | LC_ALL=C sort -u
          } > Black-adblock.txt

          echo '===== 两个版本 ====='
          echo "Black.txt（AGH 版）    : $(grep -v -c '^!' Black.txt || echo 0) 条 / $(ls -lh Black.txt | awk '{print $5}')"
          echo "Black-adblock.txt（adblock 版）: $(grep -v -c '^!' Black-adblock.txt || echo 0) 条 / $(ls -lh Black-adblock.txt | awk '{print $5}')"

      # ======================================================================
      # 路由器小体积版（可选产物，不属于上面两个版本）
      # 给内存受限设备（如 512MB 路由器上的 mosdns adblock_set）用。
      # 只取中文/本地源，输出纯域名；白名单与自建解析链上游在生成阶段物理剔除。
      # ======================================================================
      - name: 派生路由器小体积版（可选）
        run: |
          grep -v '^!' White.txt \
            | sed -e 's/[[:space:]]*#.*$//' \
            | grep -v '^[[:space:]]*$' \
            | sed -e 's/^@@[|][|]//' -e 's/^[|][|]//' -e 's/\^$//' \
            | LC_ALL=C sort -u > White-domains.tmp || true

          CN='anti-AD|那个谁520|10007|海哥|大萌主|秋风的规则|茯苓的广告规则|逆向涉猎|DD自用|困了想睡觉|本地规则'
          {
            grep '^[|][|]' Black.txt || true
            grep -E "^[^!#]+ # From: (${CN})$" Black.txt || true
          } \
            | sed -e 's/[[:space:]]*#.*$//' \
            | grep -v '^[[:space:]]*$' \
            | sed -e 's/^[|][|]//' -e 's/\^$//' \
            | grep -E '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$' \
            | LC_ALL=C sort -u > routers.tmp || true

          printf '%s\n' logic769.xyz doh.pub dns.alidns.com > upstream-allow.tmp
          grep -vxF -f White-domains.tmp routers.tmp \
            | grep -vxF -f upstream-allow.tmp > Black-domains-cn-final.txt || true

          echo "Black-domains-cn-final.txt: $(wc -l < Black-domains-cn-final.txt) 条 / $(ls -lh Black-domains-cn-final.txt | awk '{print $5}')"

      # ======================================================================
      # 去冗余全量版（Black-domains-dedup.txt）
      # 与 Black-domains-cn-final.txt 同为纯域名格式，但覆盖全部源。
      # 关键步骤：父域吸收 —— mosdns 的 domain_set / adblock_set 对裸域名是
      # 「等于该域名、或以 .该域名 结尾」的后缀匹配，所以父域已在集合里时，
      # 它下面的每条子域都是纯冗余。实测 803,676 条里 111,676 条（13.9%）
      # 属于这种冗余，删掉语义完全不变，但能省下可观内存。
      # ======================================================================
      - name: 派生去冗余全量版（Black-domains-dedup.txt）
        run: |
          # 1) 全量纯域名：ABP 域名空间段 + hosts 段统一成裸域名
          grep '^[|][|]' Black.txt | sed -e 's/^[|][|]//' -e 's/\^$//' > dedup-all.tmp || true
          grep -v '^!' Black.txt \
            | grep -v '^[|][|]' \
            | sed -e 's/[[:space:]]*#.*$//' \
            | grep -v '^[[:space:]]*$' >> dedup-all.tmp || true
          LC_ALL=C sort -u dedup-all.tmp > dedup-all.txt

          # 2) 父域吸收：任一祖先域名已在集合中则丢弃当前行
          awk 'NR==FNR { S[$0]=1; next }
          {
            d=$0; n=split(d,p,".")
            for (i=2; i<=n; i++) {
              par=p[i]
              for (j=i+1; j<=n; j++) par=par "." p[j]
              if (index(par,".")>0 && (par in S)) next
            }
            print d
          }' dedup-all.txt dedup-all.txt > dedup.tmp

          # 3) 白名单与自建解析链上游物理剔除（mosdns 没有 @@ 例外语义）
          grep -v '^!' White.txt \
            | sed -e 's/[[:space:]]*#.*$//' \
            | grep -v '^[[:space:]]*$' \
            | sed -e 's/^@@[|][|]//' -e 's/^[|][|]//' -e 's/\^$//' \
            | LC_ALL=C sort -u > dedup-white.tmp || true

          printf '%s\n' logic769.xyz doh.pub dns.alidns.com > dedup-upstream.tmp
          grep -vxF -f dedup-white.tmp dedup.tmp \
            | grep -vxF -f dedup-upstream.tmp > Black-domains-dedup.txt || true

          echo "===== 去冗余全量版 ====="
          echo "输入: $(wc -l < dedup-all.txt) 条"
          echo "输出: $(wc -l < Black-domains-dedup.txt) 条 / $(ls -lh Black-domains-dedup.txt | awk '{print $5}')"

      # 热门域小型版（Black-domains-small.txt）
      # 从去冗余全量中筛出 top-domains.txt（1 万热门域）命中的条目，
      # 命中主流广告/追踪域，体积小，适合内存极小的路由器（mosdns adblock_set）
      - name: 派生热门域小型版（Black-domains-small.txt）
        run: |
          cp documents/top-domains.txt dedup-top.tmp
          {
            echo '! Title: 热门域小型版（路由器 mosdns）'
            echo '! Description: 从全量去冗余规则中提取 top-domains.txt（1 万热门域）命中的条目，体积小，适合内存受限设备'
            echo '! Homepage: https://github.com/$GITHUB_REPOSITORY'
            echo "! Version: $(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"
            echo '!'
            grep -F -f dedup-top.tmp Black-domains-dedup.txt | LC_ALL=C sort -u
          } > Black-domains-small.txt
          echo "===== 热门域小型版 ====="
          echo "输出: $(wc -l < Black-domains-small.txt) 条 / $(ls -lh Black-domains-small.txt | awk '{print $5}')"
      - name: Compute Beijing time for release title (main)
        id: time_main
        run: |
          echo "cn_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S (UTC+8)')" >> $GITHUB_OUTPUT

      - name: Prepare release body (main)
        run: |
          BLOCK_COUNT=$(grep -v -c '^!' Black.txt || echo 0)
          ADBLOCK_COUNT=$(grep -v -c '^!' Black-adblock.txt || echo 0)
          WHITE_COUNT=$(grep -v -c '^!' White.txt || echo 0)
          CONFLICT_COUNT=$(grep -v -c '^!' Conflict.txt || echo 0)
          CN_COUNT=$(wc -l < Black-domains-cn-final.txt || echo 0)
          DEDUP_COUNT=$(wc -l < Black-domains-dedup.txt || echo 0)
          SMALL_COUNT=$(wc -l < Black-domains-small.txt || echo 0)
          {
            echo "激进的规则（main 分支）本次构建统计"
            echo
            echo "- 黑名单规则: ${BLOCK_COUNT} 条"
            echo "- 白名单规则: ${WHITE_COUNT} 条"
            echo "- 冲突规则: ${CONFLICT_COUNT} 条"
            echo
            echo "## 两个版本"
            echo
            echo "- **Black.txt**（AGH 版）: ${BLOCK_COUNT} 条。AdGuard Home 一键导入，精确域名段带来源注释。"
            echo "- **Black-adblock.txt**（adblock 版）: ${ADBLOCK_COUNT} 条。统一 ABP 语法、无行尾注释，uBlock Origin / AdGuard / mihomo 可直接导入。"
            echo
            echo "## 可选"
            echo
            echo "- **Black-domains-cn-final.txt**: 中文源纯域名子集 ${CN_COUNT} 条，给内存受限的路由器（mosdns adblock_set）。"
            echo "- **Black-domains-dedup.txt**: 全量纯域名并做父域吸收后 ${DEDUP_COUNT} 条，语义与未去冗余版完全等价，体积更小，给内存紧张的路由器用。"
            echo "- **Black-domains-small.txt**: 热门域小型版 ${SMALL_COUNT} 条，从 top-domains.txt（1 万热门域）筛出，体积小、误杀低，给内存极小的路由器（mosdns adblock_set）。"
          } > release_body_main.md

      - name: Generate release tag
        id: generate_tag
        run: |
          echo "tag=stable-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload lists to GitHub Release (main)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.generate_tag.outputs.tag }}
          name: "激进的规则 ${{ steps.time_main.outputs.cn_time }}"
          bodyFile: release_body_main.md
          makeLatest: true
          allowUpdates: false
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "Black.txt,Black-adblock.txt,White.txt,Conflict.txt,Black-domains-cn-final.txt,Black-domains-dedup.txt,Black-domains-small.txt"

      - name: Commit and push README only to main (safe rebase)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git fetch origin main
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git pull --rebase origin main || true

          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "docs(main): 更新 README"

          git fetch origin main
          git pull --rebase origin main || true

          git push origin "HEAD:main" || {
            echo "First push failed, attempting with --force-with-lease"
            git push --force-with-lease origin "HEAD:main"
          }
